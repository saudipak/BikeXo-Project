<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Select Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
}

.container{
  max-width:1100px;
  margin:80px auto;
  text-align:center;
}

h1{
  margin-bottom:40px;
  font-size:32px;
}

.brand-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
}

.brand-card{
  background:#fff;
  padding:40px 20px;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(0,0,0,0.05);
  text-decoration:none;
  color:#111;
  font-size:20px;
  font-weight:600;
  transition:0.3s;
}

.brand-card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 40px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<div class="container">
  <h1>Select a Brand</h1>

  <div class="brand-grid">
    <a href="showroom.html?brand=yamaha" class="brand-card">Yamaha</a>
    <a href="showroom.html?brand=honda" class="brand-card">Honda</a>
    <a href="showroom.html?brand=ktm" class="brand-card">KTM</a>
    <a href="showroom.html?brand=bajaj" class="brand-card">Bajaj</a>
  </div>
</div>

</body>
</html>
