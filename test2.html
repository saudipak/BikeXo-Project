<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Used Bikes</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f5f7fa;}

/* HERO */
.hero{background:linear-gradient(120deg,#0d6efd,#5fa8ff);padding:40px 20px;text-align:center;color:white;}
.hero h1{font-size:32px;margin-bottom:15px;}
.search-box{max-width:600px;margin:auto;display:flex;background:white;border-radius:50px;overflow:hidden;}
.search-box input{flex:1;padding:15px;border:none;outline:none;font-size:16px;}
.search-box button{background:#0d6efd;color:white;border:none;padding:0 25px;cursor:pointer;font-size:16px;}

/* LAYOUT */
.container{display:flex;gap:20px;padding:30px;}
.sidebar{width:250px;background:white;padding:20px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,0.08);height:fit-content;position:sticky;top:20px;}
.sidebar h3{margin-bottom:15px;}
.filter-group{margin-bottom:20px;}
.filter-group label{display:block;font-size:14px;margin-bottom:5px;color:#555;}
.filter-group select,.filter-group input{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;}

.content{flex:1;}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sort-bar select{padding:8px;border-radius:6px;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}

.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08);transition:0.3s;position:relative;}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,0.15);}
.card img{width:100%;height:180px;object-fit:cover;}

.badge{position:absolute;top:10px;left:10px;background:#ff5722;color:white;padding:5px 10px;font-size:12px;border-radius:4px;}

.card-content{padding:15px;}
.card-content h4{margin-bottom:8px;}
.price{color:#0d6efd;font-size:20px;font-weight:bold;margin-bottom:8px;}
.details{font-size:14px;color:#777;margin-bottom:15px;}

.actions{display:flex;justify-content:space-between;align-items:center;}
.actions button{background:#0d6efd;border:none;color:white;padding:8px 12px;border-radius:6px;cursor:pointer;}
.icons span{margin-right:10px;cursor:pointer;font-size:18px;}

@media(max-width:900px){
.container{flex-direction:column;}
.sidebar{width:100%;}
}
</style>
</head>

<body>

<!-- SEARCH -->
<div class="hero">
<h1>Find Used Bikes & Scooters</h1>
<div class="search-box">
<input id="searchInput" type="text" placeholder="Search Pulsar, FZ, Dio...">
<button>Search</button>
</div>
</div>

<div class="container">

<!-- FILTER -->
<div class="sidebar">
<h3>Filters</h3>

<div class="filter-group">
<label>Brand</label>
<select id="brandFilter">
<option value="all">All</option>
<option value="yamaha">Yamaha</option>
<option value="honda">Honda</option>
<option value="bajaj">Bajaj</option>
</select>
</div>

<div class="filter-group">
<label>Max Price</label>
<input id="priceFilter" type="number" placeholder="Enter max price">
</div>

</div>

<!-- GRID -->
<div class="content">

<div class="sort-bar">
<h3>Used Bikes</h3>

<select id="sortSelect">
<option value="default">Default</option>
<option value="low">Price Low to High</option>
<option value="high">Price High to Low</option>
</select>
</div>

<div class="grid" id="grid">

<!-- CARD -->
<div class="card" data-brand="bajaj" data-price="210000">
<span class="badge">Featured</span>
<img src="https://images.unsplash.com/photo-1558981359-219d6364c9c8">
<div class="card-content">
<h4>Pulsar NS200</h4>
<div class="price">210000</div>
<div class="details">2021 • 12,000 KM • Kathmandu</div>
<div class="actions"><div class="icons"><span>❤️</span><span>⚖</span></div><button>View</button></div>
</div>
</div>

<div class="card" data-brand="yamaha" data-price="230000">
<img src="https://images.unsplash.com/photo-1615906655593-ad0386982a0f">
<div class="card-content">
<h4>Yamaha FZ V3</h4>
<div class="price">230000</div>
<div class="details">2022 • 9,000 KM • Lalitpur</div>
<div class="actions"><div class="icons"><span>❤️</span><span>⚖</span></div><button>View</button></div>
</div>
</div>

<div class="card" data-brand="honda" data-price="125000">
<span class="badge">Urgent</span>
<img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65">
<div class="card-content">
<h4>Honda Dio</h4>
<div class="price">125000</div>
<div class="details">2020 • 18,000 KM • Bhaktapur</div>
<div class="actions"><div class="icons"><span>❤️</span><span>⚖</span></div><button>View</button></div>
</div>
</div>

</div>
</div>
</div>

<!-- JAVASCRIPT -->

<script>

const search = document.getElementById("searchInput");
const brand = document.getElementById("brandFilter");
const price = document.getElementById("priceFilter");
const sort = document.getElementById("sortSelect");
const cards = document.querySelectorAll(".card");
const grid = document.getElementById("grid");

function filter(){

let searchVal = search.value.toLowerCase();
let brandVal = brand.value;
let priceVal = price.value;

cards.forEach(card=>{

let name = card.querySelector("h4").innerText.toLowerCase();
let cardBrand = card.dataset.brand;
let cardPrice = parseInt(card.dataset.price);

let show = true;

if(!name.includes(searchVal)) show=false;
if(brandVal!="all" && cardBrand!=brandVal) show=false;
if(priceVal && cardPrice>priceVal) show=false;

card.style.display = show ? "block" : "none";

});

}

search.onkeyup = filter;
brand.onchange = filter;
price.onkeyup = filter;

/* SORTING */

sort.onchange = function(){

let arr = Array.from(cards);

arr.sort((a,b)=>{

let pa = parseInt(a.dataset.price);
let pb = parseInt(b.dataset.price);

if(this.value=="low") return pa-pb;
if(this.value=="high") return pb-pa;
return 0;

});

arr.forEach(card=>grid.appendChild(card));

}

</script>

</body>
</html>
