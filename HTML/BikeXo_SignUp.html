<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - BikeDekho Clone</title>
    <link rel="stylesheet" href="/CSS/BikeXo_SignUp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    

    <section class="signup-section">
        <h2>Create Your Account</h2>
        <form action="#" method="POST" class="signup-form">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>

            <button type="submit">Sign Up</button>
        </form>

        <div class="social-login">
            <p>Or sign up with:</p>
            <button class="facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
            <button class="google"><i class="fab fa-google"></i> Google</button>
            <button class="x"><i class="fab fa-twitter"></i> X</button>
        </div>

        <p>Already have an account? <a href="login.html">Login Here</a></p>
    </section>

  <script src="/JS/BikeXo_SignUp.js"></script>


</body>
</html>
